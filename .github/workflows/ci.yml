name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://kickoff:kickoff@localhost:5432/kickoff
  SESSION_SECRET: ci-test-session-secret-min-32-characters
  APP_BASE_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kickoff
          POSTGRES_PASSWORD: kickoff
          POSTGRES_DB: kickoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kickoff -d kickoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate
        run: pnpm db:migrate

      - name: Verify schema
        run: pnpm db:verify

      - name: Demo seed (idempotent)
        run: pnpm db:seed && pnpm db:seed

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright e2e
        run: pnpm test:e2e

      - name: OpenSpec validate
        run: pnpm openspec:validate

  production-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start Compose
        run: docker compose up --build -d --wait

      - name: Smoke /api/ready
        run: |
          body=$(curl -sf http://localhost:3000/api/ready)
          echo "$body"
          echo "$body" | grep -q '"status":"ready"' || echo "$body" | grep -q '"status": "ready"'

      - name: Confirm production server
        run: |
          html=$(curl -sf http://localhost:3000/login)
          echo "$html" | grep -viq "nextjs-portal"
          echo "$html" | grep -viq "__nextjs"

      - name: Stop Compose
        if: always()
        run: docker compose down -v
